<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paddock — F1 Championship Archive</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/3.4.1/tailwind.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen">

<!-- Top stripe -->
<div class="h-1.5 stripe-accent w-full"></div>

<!-- Header -->
<header class="border-b border-[var(--line)] bg-[var(--surface)]/80 backdrop-blur sticky top-0 z-30">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-2.5 h-9 bg-[var(--red)] rounded-sm"></div>
      <div>
        <h1 class="font-display font-900 text-2xl sm:text-3xl tracking-tight leading-none" style="font-weight:900;">PADDOCK</h1>
        <p class="text-[11px] tracking-[0.25em] text-[var(--text-dim)] uppercase font-mono">Championship Archive · 1950—Present</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <label for="seasonSelect" class="text-xs uppercase tracking-wider text-[var(--text-dim)] font-mono hidden sm:block">Season</label>
      <div class="relative">
        <select id="seasonSelect" class="bg-[var(--surface-2)] border border-[var(--line)] text-[var(--text)] font-mono font-bold rounded pl-3 pr-8 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--red)] cursor-pointer"></select>
        <svg class="w-3 h-3 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none text-[var(--text-dim)]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 flex gap-6 sm:gap-8 border-t border-[var(--line)]">
    <button data-tab="drivers" data-active="true" class="tab-btn py-3 text-sm sm:text-base font-display font-semibold uppercase tracking-wide text-[var(--text-dim)]">Driver Standings</button>
    <button data-tab="constructors" data-active="false" class="tab-btn py-3 text-sm sm:text-base font-display font-semibold uppercase tracking-wide text-[var(--text-dim)]">Constructor Standings</button>
    <button data-tab="schedule" data-active="false" class="tab-btn py-3 text-sm sm:text-base font-display font-semibold uppercase tracking-wide text-[var(--text-dim)]">Race Schedule</button>
  </nav>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8">

  <!-- Next race banner (schedule tab context, shown globally when relevant) -->
  <div id="nextRaceBanner" class="hidden next-race-card border border-[var(--line)] rounded-lg px-5 py-4 mb-6 flex flex-wrap items-center justify-between gap-3 fade-in">
    <div>
      <p class="text-[11px] uppercase tracking-[0.2em] text-[var(--red)] font-mono font-bold">Up Next</p>
      <p id="nextRaceName" class="font-display font-700 text-lg sm:text-xl" style="font-weight:700;"></p>
      <p id="nextRaceMeta" class="text-sm text-[var(--text-dim)] font-mono"></p>
    </div>
    <div id="nextRaceCountdown" class="font-mono font-bold text-2xl sm:text-3xl text-[var(--text)] tracking-tight"></div>
  </div>

  <!-- Status line -->
  <div id="statusLine" class="text-xs font-mono text-[var(--text-dim)] mb-3 hidden"></div>

  <!-- Loading -->
  <div id="loadingState" class="flex flex-col items-center justify-center py-24 gap-4">
    <div class="spinner"></div>
    <p class="font-mono text-sm text-[var(--text-dim)] uppercase tracking-widest">Fetching telemetry…</p>
  </div>

  <!-- Error -->
  <div id="errorState" class="hidden border border-[var(--red-dim)] bg-[var(--surface)] rounded-lg px-6 py-10 text-center">
    <p class="font-display text-lg font-700" style="font-weight:700;">Data unavailable</p>
    <p id="errorMessage" class="text-sm text-[var(--text-dim)] mt-2 max-w-md mx-auto"></p>
    <button id="retryBtn" class="mt-4 bg-[var(--red)] hover:bg-red-700 transition-colors text-white text-sm font-semibold px-4 py-2 rounded">Retry</button>
  </div>

  <!-- Content -->
  <div id="contentArea" class="hidden fade-in"></div>

</main>

<footer class="max-w-7xl mx-auto px-4 sm:px-6 py-8 text-[11px] font-mono text-[var(--text-dim)] border-t border-[var(--line)] mt-8">
  Data via Jolpica-F1 (Ergast-compatible successor API) · Ergast's original API was retired at the end of 2024.
</footer>

<!-- Stats Modal -->
<div id="statsModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div id="modalOverlay" class="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>
  <div class="relative bg-[var(--surface)] border border-[var(--line)] rounded-lg max-w-xl w-full max-h-[85vh] overflow-y-auto fade-in">
    <div class="h-1 stripe-accent w-full"></div>
    <button id="modalClose" aria-label="Close" class="absolute top-3 right-3 w-8 h-8 flex items-center justify-center rounded text-[var(--text-dim)] hover:text-[var(--text)] hover:bg-[var(--surface-2)] text-xl leading-none transition-colors">&times;</button>
    <div id="modalContent" class="p-6 sm:p-7"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
